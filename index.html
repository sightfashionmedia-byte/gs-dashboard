<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運動狀態摘要</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--plane:#eef1f4;--surface:#fbfcfd;--sunk:#f4f6f8;--ink:#0e1519;--ink2:#4c5964;--muted:#818e9a;--rule:#dfe5ea;--grid:#e6ebef;--base:#c2cbd3;
 --b1:#2a78d6;--b2:#eb6834;--ok:#1f6f4a;--ok-bg:#e8f4ee;--now:#2a5ea8;--now-bg:#e9f0fa;--warn:#8a6a12;--warn-bg:#fbf3e0;--red:#d03b3b;--red-bg:#fbe9e9;--na:#6b7784;--na-bg:#eef1f4;
 --null-ink:#8f9ba6;--shadow:0 1px 2px rgba(14,21,25,.05),0 1px 12px rgba(14,21,25,.04);--ring:rgba(14,21,25,.10);
 --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--plane:#0a0e11;--surface:#141a1f;--sunk:#10161a;--ink:#f1f5f8;--ink2:#a9b6c1;--muted:#7a8894;--rule:#232c33;--grid:#1f272d;--base:#344049;
 --b1:#3987e5;--b2:#d95926;--ok:#5fbf8e;--ok-bg:#12241b;--now:#7fb0ea;--now-bg:#111d2c;--warn:#d9a441;--warn-bg:#211c11;--red:#e66767;--red-bg:#2a1414;--na:#8a97a4;--na-bg:#171d22;--null-ink:#6d7a86;--shadow:0 1px 2px rgba(0,0,0,.4);--ring:rgba(255,255,255,.10)}}
:root[data-theme="dark"]{--plane:#0a0e11;--surface:#141a1f;--sunk:#10161a;--ink:#f1f5f8;--ink2:#a9b6c1;--muted:#7a8894;--rule:#232c33;--grid:#1f272d;--base:#344049;
 --b1:#3987e5;--b2:#d95926;--ok:#5fbf8e;--ok-bg:#12241b;--now:#7fb0ea;--now-bg:#111d2c;--warn:#d9a441;--warn-bg:#211c11;--red:#e66767;--red-bg:#2a1414;--na:#8a97a4;--na-bg:#171d22;--null-ink:#6d7a86;--shadow:0 1px 2px rgba(0,0,0,.4);--ring:rgba(255,255,255,.10)}
*{box-sizing:border-box}
body{background:var(--plane);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0;padding-block:24px 48px;padding-left:20px;padding-right:20px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-size:clamp(22px,4vw,28px);line-height:1.2;margin:2px 0 0;font-weight:600;letter-spacing:-.02em}
.asof{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.7}
.asof b{color:var(--ink2);font-weight:500}
.warn{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:3px;padding:9px 13px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--ring);border-radius:4px;box-shadow:var(--shadow);padding:18px 20px}
.panel>h2{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);color:var(--muted);margin:0 0 10px}
.goals{display:flex;flex-wrap:wrap;gap:8px}
.goal{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--ring);border-radius:3px;padding:6px 12px;background:var(--sunk);font-size:14px}
.goal b{font-weight:600} .goal span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.big{display:flex;flex-wrap:wrap;gap:22px;align-items:baseline;margin-bottom:12px}
.big .n{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1} .big .n small{font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:4px}
.big .k{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.slots{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.slot{background:var(--surface);display:grid;grid-template-columns:66px 1fr auto;gap:4px 12px;padding:9px 12px;align-items:baseline;font-size:14px}
.slot .d{font-family:var(--mono);font-size:12px;color:var(--muted)} .slot .i b{font-weight:600} .slot .i span{display:block;font-size:12.5px;color:var(--muted)}
.slot.today{background:color-mix(in srgb,var(--now-bg) 60%,var(--surface))}
.tag{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:2px;white-space:nowrap;font-weight:500;align-self:center}
.t-done{background:var(--ok-bg);color:var(--ok)} .t-today{background:var(--now-bg);color:var(--now)} .t-future{background:var(--na-bg);color:var(--na)} .t-missed{background:var(--warn-bg);color:var(--warn)}
.t-red{background:var(--red-bg);color:var(--red)} .t-yellow{background:var(--warn-bg);color:var(--warn)} .t-indeterminate,.t-green{background:var(--na-bg);color:var(--na)}
.note{margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55} .note b{color:var(--ink2);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.kv{display:flex;flex-direction:column;gap:8px;font-size:14px} .kv .row{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.kv .row .k{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:3px} .kv .row b{font-weight:600}
.kv .sub{font-size:12.5px;color:var(--muted)} .miss{color:var(--null-ink)}
.stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:2px}
.s-within{background:var(--ok-bg);color:var(--ok)} .s-edge{background:var(--warn-bg);color:var(--warn)} .s-outside{background:var(--red-bg);color:var(--red)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:18px} .fig h3{margin:0 0 4px;font-size:13.5px;font-weight:600} .fig .sub{font-size:12px;color:var(--muted);margin:0 0 6px}
svg.chart{display:block;width:100%;height:auto;overflow:visible} .chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)} .gridline{stroke:var(--grid)} .baseline{stroke:var(--base)}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:6px} .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.bars .bar{width:100%;background:var(--b2);border-radius:2px 2px 0 0;min-height:2px} .bars .bar.none{background:transparent;border-bottom:2px dashed var(--base)} .bars .l{font-family:var(--mono);font-size:9px;color:var(--muted)}
.bars .v{font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
footer{font-size:12px;color:var(--muted);line-height:1.7;border-top:1px solid var(--rule);padding-top:12px} footer a{color:var(--ink2)}
.fixed{margin:10px 0 0;font-size:13px;color:var(--ink2);background:var(--sunk);border-left:2px solid var(--base);padding:7px 11px;border-radius:0 3px 3px 0}
[hidden]{display:none!important}
@media (max-width:640px){.two,.figs{grid-template-columns:1fr} .big{gap:16px} .big .n{font-size:28px}}
</style>
<div class="wrap">
  <header class="top"><div><p class="eyebrow">GS-Coach · Fitness</p><h1 id="h1"></h1></div><div class="asof" id="asof"></div></header>
  <div id="warnbar" hidden></div>

  <section class="panel"><h2>目標</h2><div class="goals" id="goals"></div></section>

  <section class="panel"><h2>本週已記錄</h2>
    <div class="big" id="weekBig"></div>
    <div class="slots" id="slots"></div>
    <p class="fixed">已記錄 ≠ 實際完成。教室功率課未配戴手錶時不會進入 Garmin。</p>
  </section>

  <section class="panel"><h2>今日模板安排 · 昨天紀錄</h2>
    <div class="two">
      <div class="kv" id="todayKv"></div>
      <div class="kv" id="yestKv"></div>
    </div>
    <p class="fixed" id="feel"></p>
  </section>

  <footer id="foot"></footer>
</div>
<!--DASH-DATA--><script>window.__DASH__={"generated": "2026-11-09", "public": true, "activity_as_of": "2026-11-07", "health_as_of": null, "warnings": [], "goals": [{"key": "nb_run_10k", "label": "NB Run 10K", "type": "race", "date": "2026-11-01", "target": "已完賽（2026-11-01）"}, {"key": "run_10k_2027", "label": "10K 進程", "type": "race", "date": null, "target": "數字不公開"}, {"key": "weight", "label": "減脂", "type": "weight", "date": null, "target": "數字不公開"}], "week": {"week_start": "2026-11-09", "slots_recorded": 0, "slots_total": 4, "sessions": 0, "source": "2026-07-19-grand-taipei-8week-final-plan.md §10", "slots": [{"weekday": "一", "date": "2026-11-09", "item": "功率課（質）", "spec": "質課；以說話測試與身體感受調速", "status": "today", "worn": null, "sleep_before": null, "actual": []}, {"weekday": "三", "date": "2026-11-11", "item": "重訓全身", "spec": "雙重進程，先 8→12 下再加重量", "status": "future", "worn": null, "sleep_before": null, "actual": []}, {"weekday": "四", "date": "2026-11-12", "item": "彈性槽", "spec": "預設功率課（量 Z2）；或跑走課／第二次重訓", "status": "future", "worn": null, "sleep_before": null, "actual": []}, {"weekday": "六", "date": "2026-11-14", "item": "長有氧 2–3h", "spec": "Z2 騎為主，偶爾登山健行（六或日）", "status": "future", "worn": null, "sleep_before": null, "actual": []}]}, "today": {"date": "2026-11-09", "weekday": "一", "plan": {"item": "功率課（質）", "spec": "質課；以說話測試與身體感受調速"}, "plan_scope": "僅呈現既有四天週模板（課表 §10），非 10K 備賽處方，未作當日適訓判斷", "yesterday": {"date": "2026-11-08", "activities": [], "note": "無 Garmin 紀錄"}, "readings": null, "feel": null}};</script><!--/DASH-DATA-->
<script>
(()=>{const t=new URLSearchParams(location.search).get("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;})();
const PUBLIC=true;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const ST={done:"已記錄",today:"今天",future:"未到",missed:"無 Garmin 紀錄"};
let D;
function head(){document.getElementById("h1").textContent=`${D.today.date}（${D.today.weekday}）`;
  document.getElementById("asof").innerHTML=`活動資料截至 <b>${D.activity_as_of}</b>${D.health_as_of?` · 健康資料截至 <b>${D.health_as_of}</b>`:""}`;
  const w=document.getElementById("warnbar");if(D.warnings.length){w.hidden=false;w.innerHTML=D.warnings.map(x=>`<div class="warn">${x.text}</div>`).join("");}}
function goals(){const g=document.getElementById("goals");g.innerHTML="";for(const x of D.goals){const d=el("div","goal");
  if(x.type==="race")d.innerHTML=`<b>${x.label}</b><span>${x.date||x.period||"日期待填"} · ${x.target||""}</span>`;
  else d.innerHTML=`<b>${x.label}</b><span>${x.target_kg?`目標 ${x.target_kg} kg · ${x.rate_kg_per_week}/週 · 骨骼肌 ≥${x.skeletal_muscle_min_kg} kg`:x.target}</span>`;g.appendChild(d);}}
function week(){const W=D.week;
  document.getElementById("weekBig").innerHTML=`<div><span class="k">已記錄</span><span class="n">${W.slots_recorded}<small>/ ${W.slots_total}</small></span></div><div><span class="k">週</span><span class="n" style="font-size:18px">${W.week_start}<small>起</small></span></div>`;
  const s=document.getElementById("slots");s.innerHTML="";
  for(const x of W.slots){const r=el("div","slot"+(x.status==="today"?" today":""));
    const act=x.actual.length?x.actual.map(a=>`${a.bucket} ${a.min} 分${a.avg_hr?" · 均心率 "+a.avg_hr:""}`).join("；"):(x.worn?`${x.spec}<br><span class="miss">${x.worn}</span>`:x.spec);
    r.innerHTML=`<span class="d">${x.weekday} ${x.date.slice(5)}${x.sleep_before!=null?`<br><span style="font-size:11px">前晚 ${x.sleep_before}h</span>`:""}</span><span class="i"><b>${x.item}</b><span>${act}</span></span><span class="tag t-${x.status}">${ST[x.status]}</span>`;s.appendChild(r);}}
function today(){const T=D.today,R=T.readings,Y=T.yesterday;
  document.getElementById("todayKv").innerHTML=`<div class="row"><span class="k">模板</span><div><b>${T.plan.item}</b><div class="sub">${T.plan.spec}</div><div class="sub" style="margin-top:4px">${T.plan_scope}</div></div></div>
${R?`   <div class="row"><span class="k">數值</span><div>RHR ${R.rhr??"無資料"} · HRV 7 天均 ${R.hrv_7d??"無資料"} · Garmin ${R.hrv_status??"無資料"}<div class="sub">${R.as_of}</div></div></div>
   <div class="row"><span class="k">睡眠</span><div>昨晚 ${R.sleep_h!=null?R.sleep_h+" h":"無資料"}${R.sleep_score!=null?" · 分數 "+R.sleep_score:""}<div class="sub">近 7 晚：${(R.sleep_7d||[]).map(v=>v==null?"—":v).join(" · ")} h</div></div></div>`:""}`;
  document.getElementById("yestKv").innerHTML=`<div class="row"><span class="k">昨天</span><div>${Y.activities.length?Y.activities.map(a=>`<b>${a.bucket}</b> ${a.min} 分${a.km?" · "+a.km.toFixed(1)+" km":""}${a.avg_hr!==undefined?`<div class="sub">均心率 ${a.avg_hr??"—"} · 最高 ${a.max_hr??"—"}${a.avg_speed_kmh?" · "+a.avg_speed_kmh+" km/h":""}${a.avg_power?" · "+a.avg_power+" W":""}</div>`:""}`).join(""):`<span class="miss">${Y.note??"無 Garmin 紀錄"}</span>`}<div class="sub">${Y.date}</div></div></div>`;
  document.getElementById("feel").textContent=T.feel?T.feel.note:"公開版不含當日體感與健康數值。";}
function foot(){document.getElementById("foot").innerHTML=(PUBLIC?`公開版，只讀白名單欄位；健康數值以外的醫療、用藥、就醫資料在建置時即不納入。`:`<a href="detail.html">次頁 →</a>（活動摘要、規則審查、醫療欄位、資料來源）`)+`<br>本頁只陳述紀錄與模板，不做適訓或安全判斷。`;}
(window.__DASH__?Promise.resolve(window.__DASH__):fetch(PUBLIC?"../../../data/dashboard_public.json":"../../../data/dashboard.json").then(r=>r.json())).then(d=>{if(PUBLIC&&!d.public)throw new Error("非公開版資料");D=d;head();goals();week();today();foot();}).catch(e=>{document.querySelector(".wrap").insertAdjacentHTML("afterbegin",`<section class="panel"><h2>無法載入資料</h2><p>${e}<br>請先執行 python3 scripts/build_dashboard_data.py 並以本機伺服器開啟。</p></section>`);});
</script>
